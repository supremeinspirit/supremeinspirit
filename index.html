<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>supremeinspirit Repo</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--text:#1d1d1f;--muted:#6e6e73;--accent:#0a84ff;--line:#e5e5ea}
@media (prefers-color-scheme: dark){:root{--bg:#000;--card:#1c1c1e;--text:#f5f5f7;--muted:#98989d;--line:#38383a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:32px 16px 48px}
h1{font-size:28px;margin:0 0 4px}
p.sub{color:var(--muted);margin:0 0 24px}
.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:16px}
.url{display:flex;gap:8px;align-items:center}
.url code{flex:1;min-width:0;overflow-wrap:anywhere;font:15px ui-monospace,Menlo,monospace}
button,.btn{appearance:none;border:0;border-radius:10px;background:var(--accent);color:#fff;font:600 15px -apple-system,sans-serif;padding:10px 14px;text-decoration:none;display:inline-block;text-align:center;cursor:pointer}
.btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.note{color:var(--muted);font-size:14px;margin:12px 0 0}
h2{font-size:17px;margin:0 0 8px}
ul{list-style:none;margin:0;padding:0}
li{padding:10px 0;border-top:1px solid var(--line)}
li:first-child{border-top:0}
li b{display:block}
li span{color:var(--muted);font-size:14px}
</style>
</head>
<body>
<main>
<h1>supremeinspirit</h1>
<p class="sub">Tweak repository for Sileo, Zebra and Cydia</p>

<div class="card">
<h2>Repository URL</h2>
<div class="url"><code id="u">https://supremeinspirit.github.io/supremeinspirit/</code><button id="copy">Copy</button></div>
<div class="btns">
<a class="btn" href="sileo://source/https://supremeinspirit.github.io/supremeinspirit/">Sileo</a>
<a class="btn" href="zbra://sources/add/https://supremeinspirit.github.io/supremeinspirit/">Zebra</a>
<a class="btn" href="cydia://url/https://cydia.saurik.com/api/share#?source=https://supremeinspirit.github.io/supremeinspirit/">Cydia</a>
</div>
<p class="note">Add the full URL including <b>/supremeinspirit/</b> at the end. Only <code>supremeinspirit.github.io</code> gives a 404 error.</p>
</div>

<div class="card">
<h2>Packages</h2>
<ul id="list"><li><span>Loading…</span></li></ul>
</div>
</main>
<script>
document.getElementById('copy').onclick=function(){
  var t=document.getElementById('u').textContent,b=this;
  try{navigator.clipboard.writeText(t).then(function(){b.textContent='Copied';setTimeout(function(){b.textContent='Copy'},1500)})}catch(e){}
};
fetch('Packages').then(function(r){return r.text()}).then(function(t){
  var seen={},items=[];
  t.split(/\n\n+/).forEach(function(s){
    var d={};s.split('\n').forEach(function(l){var i=l.indexOf(':');if(i>0&&l[0]!==' ')d[l.slice(0,i)]=l.slice(i+1).trim()});
    if(!d.Package)return;
    var arch=d.Architecture==='iphoneos-arm64'?'rootless':'rootful';
    var k=(d.Name||d.Package);
    if(!seen[k]){seen[k]={name:k,desc:d.Description||'',v:[]};items.push(seen[k])}
    seen[k].v.push(d.Version.replace(/^\d+:/,'')+' ('+arch+')');
  });
  var ul=document.getElementById('list');ul.innerHTML='';
  items.forEach(function(p){
    var li=document.createElement('li'),b=document.createElement('b'),s=document.createElement('span');
    b.textContent=p.name;s.textContent=p.v.join(' · ')+(p.desc?' — '+p.desc:'');
    li.appendChild(b);li.appendChild(s);ul.appendChild(li);
  });
}).catch(function(){document.getElementById('list').innerHTML='<li><span>Open the repo in a package manager to see the packages.</span></li>'});
</script>
</body>
</html>
